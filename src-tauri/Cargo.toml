[package]
name = "calcbook"
version = "0.2.1"
description = "A quiet calculator notebook"
authors = ["Tairraos"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "calcbook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
